services:
  - type: web
    name: bhusync-api
    runtime: python
    buildCommand: pip install -r backend/requirements-cloud.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
