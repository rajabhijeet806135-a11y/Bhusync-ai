[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bhusynch-ai"
version = "1.0.0"
description = "National Urban Cadastral Intelligence Mesh — BhuSynch AI Backend"
readme = "README.md"
license = {text = "Proprietary — Government of India"}
requires-python = ">=3.10"
authors = [
    {name = "BhuSynch AI Team", email = "bhusynch@gov.in"},
]
keywords = [
    "cadastral", "geospatial", "geoai", "urban-land-records",
    "postGIS", "ogc", "ulpin", "naksha", "dilrmp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
bhusynch = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
