# ──────────────────────────────────────────────────────────────────────────────
# BhuSynch AI — NGINX Reverse Proxy Configuration
# Routes: Frontend static files, API proxy, Martin tile server, WebSocket
# ──────────────────────────────────────────────────────────────────────────────

# Upstream definitions
upstream api_backend {
    server api:8000;
    keepalive 32;
}

upstream martin_tiles {
    server martin:3000;
    keepalive 16;
}

upstream keycloak_auth {
    server keycloak:8080;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=tile_rate:10m rate=300r/m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss: https://*.tile.openstreetmap.org;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/vnd.mapbox-vector-tile
        application/x-protobuf
        image/svg+xml;

    # ─────────────── Health check endpoint ───────────────
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"bhusynch-frontend"}';
        add_header Content-Type application/json;
    }

    # ─────────────── Static frontend files ───────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─────────────── Mobile PWA ───────────────
    location /mobile/ {
        alias /usr/share/nginx/html/mobile/;
        try_files $uri $uri/ /mobile/index.html;

        # Service worker must not be cached
        location = /mobile/sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # ─────────────── OGC API — Features / Processes ───────────────
    location /ogc/ {
        limit_req zone=api_rate burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large payloads for GeoJSON
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─────────────── REST API v1 ───────────────
    location /api/ {
        limit_req zone=api_rate burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ─────────────── Martin Vector Tiles (MVT / PBF) ───────────────
    location /tiles/ {
        limit_req zone=tile_rate burst=50 nodelay;

        proxy_pass http://martin_tiles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache tiles for 1 hour
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ─────────────── Keycloak Auth ───────────────
    location /auth/ {
        proxy_pass http://keycloak_auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ─────────────── WebSocket support (for real-time updates) ───────────────
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
