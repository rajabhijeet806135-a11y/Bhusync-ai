# ──────────────────────────────────────────────────────────────────────────────
# BhuSynch AI — Kubernetes Ingress (NGINX Ingress Controller)
# Routes external traffic to API, frontend, tiles, and auth services
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bhusynch-ingress
  namespace: bhusynch
  labels:
    app.kubernetes.io/name: bhusynch-ingress
    app.kubernetes.io/part-of: bhusynch-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/use-gzip: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bhusynch.gov.in
      secretName: bhusynch-tls
  rules:
    - host: bhusynch.gov.in
      http:
        paths:
          # Frontend — 3D Web-GIS Console
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80

          # OGC API endpoints
          - path: /ogc
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 8000

          # REST API v1
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 8000

          # Martin Vector Tile Server
          - path: /tiles
            pathType: Prefix
            backend:
              service:
                name: martin-svc
                port:
                  number: 3000

          # Keycloak Authentication
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak-svc
                port:
                  number: 8080
