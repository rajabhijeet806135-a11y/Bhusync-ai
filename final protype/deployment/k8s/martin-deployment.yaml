apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhusynch-martin
  namespace: bhusynch-ai
  labels:
    app: bhusynch-martin
    tier: tile-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bhusynch-martin
  template:
    metadata:
      labels:
        app: bhusynch-martin
        tier: tile-server
    spec:
      containers:
        - name: martin
          image: ghcr.io/maplibre/martin:latest
          ports:
            - containerPort: 3000
              name: http
          args:
            - "--listen-addresses"
            - "0.0.0.0:3000"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bhusynch-db-secret
                  key: database-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bhusynch-martin
  namespace: bhusynch-ai
  labels:
    app: bhusynch-martin
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: bhusynch-martin
