apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bhusynch-minio
  namespace: bhusynch-ai
  labels:
    app: bhusynch-minio
    tier: storage
spec:
  serviceName: bhusynch-minio
  replicas: 4
  selector:
    matchLabels:
      app: bhusynch-minio
  template:
    metadata:
      labels:
        app: bhusynch-minio
        tier: storage
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          command: ["minio"]
          args:
            - "server"
            - "http://bhusynch-minio-{0...3}.bhusynch-minio.bhusynch-ai.svc.cluster.local/data"
            - "--console-address"
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: bhusynch-minio-secret
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhusynch-minio-secret
                  key: secret-key
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bhusynch-minio
  namespace: bhusynch-ai
  labels:
    app: bhusynch-minio
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: api
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
  selector:
    app: bhusynch-minio
