apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bhusynch-postgres
  namespace: bhusynch-ai
  labels:
    app: bhusynch-postgres
    tier: database
spec:
  serviceName: bhusynch-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bhusynch-postgres
  template:
    metadata:
      labels:
        app: bhusynch-postgres
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "bhusynch_cadastral"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bhusynch-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhusynch-db-secret
                  key: password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "16Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - bhusynch_cadastral
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - bhusynch_cadastral
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: bhusynch-db-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bhusynch-postgres
  namespace: bhusynch-ai
  labels:
    app: bhusynch-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: bhusynch-postgres
---
# Read Replicas StatefulSet (2 replicas per architecture spec)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bhusynch-postgres-replica
  namespace: bhusynch-ai
  labels:
    app: bhusynch-postgres-replica
    tier: database
    role: read-replica
spec:
  serviceName: bhusynch-postgres-replica
  replicas: 2
  selector:
    matchLabels:
      app: bhusynch-postgres-replica
  template:
    metadata:
      labels:
        app: bhusynch-postgres-replica
        tier: database
        role: read-replica
    spec:
      containers:
        - name: postgres-replica
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bhusynch-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhusynch-db-secret
                  key: password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          command:
            - bash
            - -c
            - |
              pg_basebackup -h bhusynch-postgres -U ${POSTGRES_USER} -D ${PGDATA} -Fp -Xs -R
              exec postgres
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"
          volumeMounts:
            - name: replica-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: replica-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bhusynch-postgres-read
  namespace: bhusynch-ai
  labels:
    app: bhusynch-postgres-replica
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: bhusynch-postgres-replica
